# /etc/nginx/sites-available/houseinmozambique
# Certbot adds the HTTPS (443) block and the http->https redirect itself.

server {
    listen 80;
    listen [::]:80;
    server_name houseinmozambique.com www.houseinmozambique.com;

    # Listing photos are uploaded through server actions (limit 10mb in next.config.ts).
    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build assets never change — let browsers keep them for a year.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
