# /etc/nginx/sites-available/houseinmozambique.conf
# Proxies houseinmozambique.com to the Docker container on 127.0.0.1:3010.
# Lives next to RoadReady's config on the same server (all names here are
# prefixed hm_ so they never clash with RoadReady's).
#
# HTTPS: after enabling this file, run
#   sudo certbot --nginx -d houseinmozambique.com -d www.houseinmozambique.com --redirect
# certbot adds the certificate lines and the http->https redirect itself.

proxy_cache_path /var/cache/nginx/houseinmozambique levels=1:2 keys_zone=hm_static:10m
                 max_size=500m inactive=30d use_temp_path=off;

upstream hm_app {
    server 127.0.0.1:3010;
    keepalive 32;
}

map $http_upgrade $hm_connection {
    default upgrade;
    ""      "";
}

map $http_accept $hm_image_format {
    default        "original";
    "~*image/avif" "avif";
    "~*image/webp" "webp";
}

server {
    listen 80;
    listen [::]:80;
    server_name houseinmozambique.com www.houseinmozambique.com;

    # The apps and search engines use the bare domain.
    if ($host = www.houseinmozambique.com) {
        return 301 https://houseinmozambique.com$request_uri;
    }

    # Photos are uploaded as base64 in JSON (up to ~10 MB).
    client_max_body_size 20M;

    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection $hm_connection;

    # Hashed build assets never change.
    location /_next/static/ {
        proxy_pass        http://hm_app;
        proxy_cache       hm_static;
        proxy_cache_valid 200 30d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock  on;
        add_header        X-Cache-Status $upstream_cache_status;
    }

    # Resized images: one cached copy per format.
    location /_next/image {
        proxy_pass           http://hm_app;
        proxy_cache          hm_static;
        proxy_cache_key      "$scheme$proxy_host$request_uri|$hm_image_format";
        proxy_ignore_headers Cache-Control Expires Vary;
        proxy_cache_valid    200 7d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock     on;
        add_header           X-Cache-Status $upstream_cache_status;
    }

    location / {
        proxy_pass            http://hm_app;
        proxy_set_header      Upgrade $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}
